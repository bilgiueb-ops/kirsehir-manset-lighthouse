name: Kirsehir Manset Lighthouse SEO

on:
  workflow_dispatch:

  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run Lighthouse
        run: npm run audit

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Yeni veri yok."
          else
            git commit -m "chore: update lighthouse results"
            git push
          fi
