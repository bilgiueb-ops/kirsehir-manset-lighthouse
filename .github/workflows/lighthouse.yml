name: Kirsehir Manset Lighthouse SEO

on:
  workflow_dispatch:

  schedule:
    - cron: "17 8 * * *"
      timezone: "Europe/Istanbul"

permissions:
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    env:
      SITE_URL: https://kirsehirmanset.com/
      MAX_URLS: "10"
      TARGET_FEED_URL: ${{ secrets.TARGET_FEED_URL }}
      TARGET_FEED_KEY: ${{ secrets.TARGET_FEED_KEY }}

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check configuration
        run: |
          if [ -z "$TARGET_FEED_URL" ]; then
            echo "ERROR: TARGET_FEED_URL boş."
            exit 1
          fi

          if [ -z "$TARGET_FEED_KEY" ]; then
            echo "ERROR: TARGET_FEED_KEY boş."
            exit 1
          fi

          echo "TARGET_FEED_URL tanimli."
          echo "TARGET_FEED_KEY tanimli."

      - name: Install dependencies
        run: npm install

      - name: Run Lighthouse
        run: npm run audit

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Yeni Lighthouse verisi yok."
          else
            git commit -m "chore: update lighthouse results"
            git push
          fi
