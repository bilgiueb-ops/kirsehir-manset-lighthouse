name: Kirsehir Manset Lighthouse SEO

on:
  workflow_dispatch:

  schedule:
    - cron: "17 8 * * *"
      timezone: "Europe/Istanbul"

permissions:
  contents: write

concurrency:
  group: kirsehir-manset-lighthouse
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    env:
      SITE_URL: https://kirsehirmanset.com/
      MAX_URLS: "10"
      TARGET_FEED_URL: ${{ secrets.TARGET_FEED_URL }}
      TARGET_FEED_KEY: ${{ secrets.TARGET_FEED_KEY }}

    steps:
      - name: Repository checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package.json

      - name: Check configuration
        run: |
          test -n "$TARGET_FEED_URL" || { echo "ERROR: TARGET_FEED_URL boş."; exit 1; }
          test -n "$TARGET_FEED_KEY" || { echo "ERROR: TARGET_FEED_KEY boş."; exit 1; }
          echo "TARGET_FEED_URL tanımlı."
          echo "TARGET_FEED_KEY tanımlı."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Lighthouse
        run: npm run audit

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Yeni Lighthouse verisi yok."
          else
            git commit -m "chore: update lighthouse results"
            git push
          fi
